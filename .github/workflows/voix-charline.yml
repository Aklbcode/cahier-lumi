name: Voix Charline (nouvelles phrases)
on:
  push:
    branches: ['lumi-*']
    paths: ['.github/workflows/voix-charline.yml', 'audit-voix/phrases-a-generer.json']
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test réseau
        run: |
          pip install edge-tts==7.3.1 >/dev/null
          python3 -c "
          import asyncio, edge_tts
          async def m():
              n=0
              async for e in edge_tts.Communicate('Bonjour Luca.','fr-BE-CharlineNeural').stream():
                  if e['type']=='audio': n+=len(e['data'])
              print('audio bytes',n)
          asyncio.run(m())"
