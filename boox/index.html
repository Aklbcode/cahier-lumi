<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Cahier de Lumi · BOOX</title>
<meta name="description" content="Jeux éducatifs pour Luca et Lola : lecture, calcul, logique.">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<style>
[hidden]{display:none!important}
/* Layout: un cahier d'école posé sur une table ensoleillée — tuiles rondes et dodues, une grande scène par jeu, lignage Seyès pour l'écrit */
:root{
  --ground:#E8F4EF;
  --ground-2:#EEF1FB;
  --paper:#FFFFFF;
  --ink:#1F2E45;
  --ink-soft:#56657E;
  --line:#D6E2EC;
  --seyes:#B9D3EC;
  --margin:#EE8A8A;
  --tomato:#FF6B57;
  --sun:#FFC43D;
  --leaf:#35B872;
  --sky:#3AA2EE;
  --plum:#8E63E6;
  --pink:#FF86B3;
  --teal:#1FB39B;
  --orange:#FF9636;
  --ok:#27AE60;
  --no:#E5533D;
  --syl-a:#2363C9;
  --syl-b:#D2393A;
  --mute:#B3BCC9;
  --font-display:'Grandstander','Baloo 2','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  --font-read:'Andika','Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --font-cursive:'Playwrite BE WAL','Segoe Script','Apple Chancery',cursive;
  --r-xl:34px; --r-lg:24px; --r-md:16px;
  --shadow:0 6px 0 rgba(31,46,69,.10), 0 14px 30px rgba(31,46,69,.10);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--font-read); font-size:17px; line-height:1.4;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
.app{min-height:100%;display:flex;flex-direction:column;overflow-x:clip}
.go-btn svg,.hint-btn svg{width:1.1em;height:1.1em;display:block}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Splash ---------- */
.splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 38%,#FFF6D6 0,#FFE7A3 30%,var(--ground) 72%);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash h1{font-family:var(--font-display);font-size:clamp(34px,7vw,64px);margin:0;line-height:1.05;text-wrap:balance}
.splash p{margin:0;color:var(--ink-soft);font-size:clamp(16px,2.4vw,20px)}
.splash .lumi{width:clamp(150px,30vw,230px);animation:float 3s ease-in-out infinite}
.btn-play{font-family:var(--font-display);font-size:clamp(24px,4vw,34px);background:var(--leaf);color:#fff;padding:14px 46px;border-radius:999px;
  box-shadow:0 7px 0 #24894f;transition:transform .1s}
.btn-play:active{transform:translateY(5px);box-shadow:0 2px 0 #24894f}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);box-shadow:0 2px 0 var(--line)}
body::before{content:"";position:fixed;top:0;right:0;bottom:auto;left:0;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .lumi{width:46px;flex:none}
.brand b{font-family:var(--font-display);font-size:clamp(20px,3.2vw,28px);line-height:1;white-space:nowrap}
.brand small{display:block;color:var(--ink-soft);font-size:13px;margin-top:3px}
.chip{display:flex;align-items:center;gap:8px;background:var(--ground);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;min-height:48px}
.chip .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.chip .stars{color:#B98500}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ground);font-size:22px;flex:none}
.icon-btn svg{width:24px;height:24px}

/* ---------- Worlds (tabs) ---------- */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:18px 6px}
.world{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-lg);background:var(--paper);box-shadow:0 4px 0 var(--line);text-align:left;min-height:84px;transition:transform .12s}
.world:active{transform:translateY(3px)}
.world .em{font-size:40px;flex:none;filter:saturate(1.1)}
.world b{font-family:var(--font-display);font-size:clamp(19px,2.8vw,26px);display:block;line-height:1.1}
.world span{color:var(--ink-soft);font-size:14px}
.world[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 5px 0 #0d1828}
.world[aria-selected="true"] span{color:#C8D4E6}
.hello{display:flex;align-items:center;gap:12px;padding-block:14px 4px}
.bubble{background:var(--paper);border-radius:20px;padding:12px 18px;position:relative;font-size:18px;box-shadow:0 3px 0 var(--line);max-width:640px}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--paper);border-left:0}
.hello .lumi{width:64px;flex:none}

/* ---------- Tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;padding-block:14px 40px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:8px;min-height:170px;padding:16px;border-radius:var(--r-lg);
  color:#fff;text-align:left;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.tile.big{grid-column:span 2;min-height:200px}
.tile b{font-family:var(--font-display);font-size:clamp(19px,2.5vw,25px);line-height:1.08;text-shadow:0 2px 0 rgba(0,0,0,.12);max-width:64%}
.tile .em{position:absolute;right:10px;top:10px;font-size:clamp(46px,6.4vw,66px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));transition:transform .3s}
.tile.big .em{top:auto;bottom:10px;right:16px;font-size:clamp(70px,9vw,100px)}
.tile:hover .em{transform:rotate(-8deg) scale(1.06)}
.tile .lv{background:rgba(255,255,255,.28);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.tile .sub{font-size:14px;opacity:.95;max-width:64%}
.tile.big b,.tile.big .sub{max-width:62%}
.tile .pb{width:100%;height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.tile .pb i{display:block;height:100%;background:#fff;border-radius:9px}
.tile.seyes::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:repeating-linear-gradient(to bottom,transparent 0 15px,rgba(255,255,255,.18) 15px 16px);pointer-events:none}
.c-tomato{background:var(--tomato)} .c-sun{background:#F6B21E} .c-leaf{background:var(--leaf)} .c-sky{background:var(--sky)}
.c-plum{background:var(--plum)} .c-pink{background:var(--pink)} .c-teal{background:var(--teal)} .c-orange{background:var(--orange)}
.c-navy{background:#3C5A99} .c-lime{background:#86C232}
.section-title{font-family:var(--font-display);font-size:22px;margin:8px 0 0}

/* ---------- Mascot ---------- */
.lumi{display:block}
.lumi .eye-l,.lumi .eye-r{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.lumi.happy{animation:hop .6s ease}
.lumi.oops{animation:tilt .6s ease}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- Game shell ---------- */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;display:flex;flex-direction:column;background:var(--ground-2)}
.game-top,.game-bottom{display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.game-top{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:6px}
.game-bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:6px;min-height:84px}
.round-btn{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--line);flex:none;transition:transform .1s}
.round-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.round-btn svg{width:30px;height:30px}
.dots{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.dots i.ok{background:var(--leaf);box-shadow:none}
.dots i.half{background:var(--sun);box-shadow:none}
.dots i.now{box-shadow:inset 0 0 0 3px var(--sky);transform:scale(1.25)}
.lvl{font-family:var(--font-display);background:#fff;border-radius:999px;padding:8px 14px;font-size:16px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.stage-wrap{flex:1;display:flex;min-height:0;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.stage{position:relative;flex:1;min-height:0;min-width:0;border-radius:var(--r-xl);background:#C8EBA1;box-shadow:0 0 0 10px #fff, 0 16px 40px rgba(31,46,69,.14);margin:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,26px);padding:clamp(12px,3vw,34px);overflow:hidden}
.stage.paper{background:#fff;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--seyes) 31px 32px);}
.caption{flex:1;min-width:0;font-size:clamp(15px,2vw,19px);color:var(--ink-soft);text-align:center;line-height:1.25}
.game-bottom .lumi{width:70px;flex:none}

/* ---------- Generic choice cards ---------- */
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(10px,2.2vw,26px);max-width:100%}
.card{background:#fff;border-radius:var(--r-lg);box-shadow:0 6px 0 rgba(31,46,69,.14);min-width:clamp(86px,15vw,150px);min-height:clamp(86px,15vw,150px);
  display:grid;place-items:center;padding:10px;font-size:clamp(46px,9vw,92px);line-height:1;transition:transform .12s, box-shadow .12s;position:relative}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,46,69,.14)}
.card.txt{font-family:var(--font-read);font-weight:700;color:var(--ink)}
.card.sel{box-shadow:0 0 0 6px var(--sky),0 6px 0 rgba(31,46,69,.14)}
.ok-flash{animation:okf .6s ease}
@keyframes okf{0%{transform:scale(1)}40%{transform:scale(1.15);box-shadow:0 0 0 10px var(--ok)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(6px)}}
.reveal{animation:rev 1.1s ease-in-out infinite;z-index:2}
@keyframes rev{0%,100%{box-shadow:0 0 0 0 rgba(255,196,61,.9),0 6px 0 rgba(31,46,69,.14)}50%{box-shadow:0 0 0 14px rgba(255,196,61,.0),0 0 0 7px var(--sun)}}
.prompt{font-family:var(--font-display);font-size:clamp(22px,3.6vw,36px);text-align:center;line-height:1.15;text-wrap:balance;margin:0}
.big-num{font-family:var(--font-display);font-size:clamp(60px,12vw,120px);line-height:1}
.ghost{opacity:.35}
.hint-btn{font-family:var(--font-display);background:#fff;border-radius:999px;padding:10px 20px;box-shadow:0 4px 0 var(--line);font-size:18px;display:inline-flex;gap:8px;align-items:center}
.go-btn{font-family:var(--font-display);background:var(--leaf);color:#fff;border-radius:999px;padding:12px 30px;font-size:clamp(20px,3vw,28px);box-shadow:0 6px 0 #24894f;display:inline-flex;gap:10px;align-items:center}
.go-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #24894f}
.go-btn[disabled]{background:var(--mute);box-shadow:0 6px 0 #97a1af}

/* ---------- Balloons ---------- */
.sky{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(#BFE6FF,#E4F5FF 70%,#C8EBA1 70%)}
.balloons{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2vw,24px);flex-wrap:wrap;z-index:1}
.balloon{width:clamp(70px,12vw,120px);height:clamp(108px,18vw,180px);animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.balloon svg{width:100%;height:100%;overflow:visible}
.balloon.pop{animation:pop .35s ease forwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.basket{width:clamp(84px,14vw,130px);height:clamp(70px,11vw,100px);border-radius:12px 12px 40px 40px;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 6px 0 rgba(0,0,0,.12);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 14px)}

/* ---------- Counting ---------- */
.field{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(4px,1.2vw,14px);max-width:min(640px,100%);font-size:clamp(40px,7vw,70px);line-height:1}
.field .obj{position:relative;transition:transform .2s;cursor:pointer}
.field .obj.counted::after{content:attr(data-n);position:absolute;right:-6px;top:-8px;background:var(--sky);color:#fff;font:700 18px/26px var(--font-read);width:26px;height:26px;border-radius:50%;text-align:center}
.dotcard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:clamp(70px,11vw,100px);height:clamp(70px,11vw,100px)}
.dotcard i{border-radius:50%;background:transparent}
.dotcard i.on{background:var(--ink)}
.plate{background:#fff;border-radius:50%;width:clamp(140px,26vw,230px);height:clamp(140px,26vw,230px);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;font-size:clamp(28px,5vw,44px);box-shadow:0 6px 0 rgba(0,0,0,.12),inset 0 0 0 12px #F3F6FA;padding:24px}
.tree{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:340px;font-size:clamp(40px,7vw,60px);background:radial-gradient(circle,#7BCB6A 0,#5DB14E 70%);border-radius:50% 50% 45% 45%;padding:26px 22px}
.tree .obj{cursor:pointer;transition:transform .25s}
.panier{min-width:200px;min-height:90px;border-radius:14px 14px 50px 50px;background:#C98A4B;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 8px,transparent 8px 18px);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;padding:10px 18px 18px;font-size:clamp(30px,5vw,44px);box-shadow:0 6px 0 rgba(0,0,0,.15)}

/* ---------- Shapes ---------- */
.shape{width:clamp(80px,14vw,130px);height:clamp(80px,14vw,130px)}
.shape svg{width:100%;height:100%;overflow:visible}
.hole{background:#8DBB64;border-radius:18px;padding:12px;box-shadow:inset 0 6px 0 rgba(0,0,0,.15)}
.hole svg path,.hole svg circle,.hole svg rect,.hole svg ellipse{fill:#4C7A33}
.piece{touch-action:none;cursor:grab}
.dragging{z-index:50;cursor:grabbing;transition:none!important}

/* ---------- Space scenes ---------- */
.scene{position:relative;width:clamp(140px,27vw,270px);height:clamp(150px,28vw,280px);background:#fff;border-radius:var(--r-lg);box-shadow:0 6px 0 rgba(31,46,69,.14);overflow:hidden}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:#EBD9BE}
.scene .cat{position:absolute;font-size:clamp(36px,6vw,54px);line-height:1}
.prop-box{position:absolute;width:46%;height:36%;background:#C98A4B;border-radius:6px;box-shadow:inset 0 10px 0 #A86E35}
.prop-box.closed{box-shadow:inset 0 -8px 0 #A86E35}
.prop-table{position:absolute;width:64%;height:42%}
.prop-table .tt{position:absolute;left:0;right:0;top:0;height:14%;background:#8D5A34;border-radius:6px}
.prop-table .leg{position:absolute;top:10%;width:9%;height:90%;background:#7A4A27}

/* ---------- Sizes ---------- */
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2.4vw,30px);min-height:42%}
.sizes .card{min-width:0;min-height:0;background:transparent;box-shadow:none;padding:6px;border-radius:20px}
.sizes .card.sel{background:#fff}
.order-line{display:flex;gap:12px;justify-content:center;align-items:flex-end;min-height:90px;border-bottom:6px dashed rgba(31,46,69,.2);padding:6px 20px;min-width:min(420px,90%)}
.pencil{height:26px;border-radius:6px 30px 30px 6px;background:linear-gradient(90deg,#F2C14E 0 85%,#F7E3B5 85% 93%,#333 93%)}

/* ---------- Memory ---------- */
.memo{display:grid;gap:clamp(6px,1.4vw,14px);width:min(100%,760px)}
.mcard{aspect-ratio:1;max-width:100%;perspective:600px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .f{background:var(--plum);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35) 0 10%,transparent 11%),radial-gradient(circle at 70% 65%,rgba(255,255,255,.25) 0 8%,transparent 9%);box-shadow:0 5px 0 #6b45c2}
.mcard .b{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,6vw,56px);box-shadow:0 5px 0 var(--line);font-family:var(--font-read);font-weight:700;color:var(--ink)}
.mcard .b.word{font-size:clamp(17px,3vw,28px)}
.mcard.done .b{background:#E3F7EA;box-shadow:0 5px 0 #b9e5c8}

/* ---------- Pattern beads ---------- */
.necklace{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:16px 20px;background:rgba(255,255,255,.6);border-radius:60px;position:relative}
.bead{width:clamp(44px,7vw,70px);height:clamp(44px,7vw,70px);display:grid;place-items:center;font-size:clamp(30px,5vw,48px)}
.bead.slot{border:4px dashed var(--ink-soft);border-radius:50%;font-family:var(--font-display);color:var(--ink-soft);font-size:28px}
.seqnum{font-family:var(--font-display);font-size:clamp(28px,5vw,46px);background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 4px 0 var(--line)}

/* ---------- Shadows / puzzle ---------- */
.shadow{filter:brightness(0) opacity(.78)}
.puzzle-board{display:grid;gap:4px;background:rgba(255,255,255,.7);padding:6px;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.pz-slot{background:rgba(31,46,69,.08);border-radius:8px;background-size:cover}
.pz-piece{border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.18);touch-action:none;cursor:grab;background-repeat:no-repeat}
.pz-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:80px}

/* ---------- Syllables / drum ---------- */
.drum{width:clamp(130px,22vw,190px);height:clamp(130px,22vw,190px);border-radius:50%;background:radial-gradient(circle at 50% 40%,#FFF4E3 0 55%,#F2D8B0 56% 62%,var(--tomato) 63%);box-shadow:0 10px 0 #c64a39;font-size:44px;transition:transform .08s}
.drum:active,.drum.hit{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 #c64a39}
.claps{display:flex;gap:10px;min-height:48px;font-size:40px}

/* ---------- Reading ---------- */
.grapheme{font-family:var(--font-read);font-weight:700;font-size:clamp(90px,18vw,180px);line-height:1;color:var(--ink)}
.cursive{font-family:var(--font-cursive);font-weight:400}
.gcard{background:#fff;border-radius:var(--r-lg);padding:16px 28px;box-shadow:0 6px 0 rgba(31,46,69,.14);display:flex;align-items:baseline;gap:clamp(14px,3vw,34px)}
.gcard .alt{font-size:clamp(46px,8vw,80px);color:var(--ink-soft)}
.word{font-family:var(--font-read);font-weight:700;font-size:clamp(46px,9vw,96px);line-height:1.1;letter-spacing:.02em;display:inline-flex;flex-wrap:wrap;justify-content:center}
.word .s0{color:var(--syl-a)} .word .s1{color:var(--syl-b)}
.word .mute{color:var(--mute)}
.sent{font-family:var(--font-read);font-weight:700;font-size:clamp(28px,5vw,48px);line-height:1.5;text-align:center;max-width:900px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .32em}
.sent .w{display:inline-flex}
.sent .mo{color:var(--plum);text-decoration:underline dotted 3px;text-underline-offset:8px;cursor:pointer}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{min-width:clamp(56px,9vw,84px);height:clamp(66px,10vw,96px);border-radius:14px;background:rgba(255,255,255,.75);border-bottom:6px solid var(--ink-soft);display:grid;place-items:center;font:700 clamp(36px,6vw,58px)/1 var(--font-read);color:var(--ink)}
.slot.fill{background:#fff;border-bottom-color:var(--leaf)}
.slot.mute{color:var(--mute);border-bottom-color:var(--line)}
.slot.next{border-bottom-color:var(--sky);animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#E6F3FF}}
.tiles-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ltile{min-width:clamp(60px,9vw,86px);height:clamp(60px,9vw,86px);border-radius:16px;background:#FFE9A8;box-shadow:0 5px 0 #E2BE57;font:700 clamp(32px,5.4vw,50px)/1 var(--font-read);color:var(--ink);padding:0 10px}
.ltile.dig{background:#D9ECFF;box-shadow:0 5px 0 #9CC3E8}
.ltile.used{visibility:hidden}
.sound-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.sbtn{width:clamp(84px,14vw,120px);height:clamp(84px,14vw,120px);border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(31,46,69,.14);display:grid;place-items:center;position:relative}
.sbtn svg{width:44%;height:44%}
.sbtn .n{position:absolute;top:-6px;left:-6px;width:32px;height:32px;border-radius:50%;color:#fff;font:700 18px/32px var(--font-display);text-align:center}
.sbtn.sel{box-shadow:0 0 0 6px var(--sky),0 6px 0 rgba(31,46,69,.14)}
.fusion{display:flex;align-items:center;gap:10px;font:700 clamp(60px,12vw,120px)/1 var(--font-read)}
.fusion .c,.fusion .v{background:#fff;border-radius:22px;padding:8px 22px;box-shadow:0 6px 0 rgba(31,46,69,.14);transition:transform .7s cubic-bezier(.5,-0.4,.5,1.4)}
.fusion .c{color:#D93A3A} .fusion .v{color:#1F6FCC}
.pics .card{font-size:clamp(50px,10vw,96px)}
.pics .card .spk{position:absolute;right:-8px;top:-8px;width:36px;height:36px;border-radius:50%;background:var(--sky);display:grid;place-items:center;box-shadow:0 3px 0 #2a7fbf}
.pics .card .spk svg{width:20px;height:20px}
.combo{display:flex;gap:4px;font-size:clamp(38px,7vw,64px)}

/* ---------- Maps (lecture, calcul) ---------- */
.map{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;padding:24px 16px 120px;background:#fff;background-image:linear-gradient(90deg,transparent 0 54px,var(--margin) 54px 56px,transparent 56px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--seyes) 31px 32px)}
.map-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font:700 34px/1 var(--font-read);color:#fff;background:var(--plum);box-shadow:0 7px 0 #6b45c2;position:relative;flex:none;transition:transform .12s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 #6b45c2}
.node.lock{background:#D5DBE5;box-shadow:0 7px 0 #b3bbc8;color:#8b96a8}
.node.done{background:var(--leaf);box-shadow:0 7px 0 #24894f}
.node.cur{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 7px 0 #6b45c2,0 0 0 14px rgba(142,99,230,.25)}}
.node .st{position:absolute;bottom:-14px;font-size:15px;letter-spacing:-2px}
.node-row{display:flex;align-items:center;gap:16px;width:100%}
.node-row .lab{font-size:15px;color:var(--ink-soft);flex:1;line-height:1.2}
.node-row.l{flex-direction:row} .node-row.r{flex-direction:row-reverse;text-align:right}
.node-row .sp{width:16%}
.isle{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 var(--line);text-align:left}
.isle.lock{opacity:.55}
.isle .badge{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:700 26px/1 var(--font-display);color:#fff;flex:none}
.isle b{font-family:var(--font-display);font-size:20px;display:block}
.isle span{color:var(--ink-soft);font-size:14px}
.isle .lv3{margin-left:auto;display:flex;gap:4px;font-size:20px}

/* ---------- Math ---------- */
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#3C5A99;padding:6px;border-radius:10px;width:clamp(170px,30vw,260px)}
.frame i{aspect-ratio:1;background:#fff;border-radius:6px;display:grid;place-items:center;position:relative}
.frame i::after{content:"";width:72%;height:72%;border-radius:50%}
.frame i.a::after{background:var(--tomato)} .frame i.b::after{background:var(--sky)}
.frame i.x::before{content:"";position:absolute;top:14%;right:14%;bottom:14%;left:14%;background:linear-gradient(45deg,transparent 44%,var(--ink) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--ink) 44% 56%,transparent 56%);z-index:1}
.frame i.x::after{opacity:.35}
.eq{font-family:var(--font-display);font-size:clamp(40px,8vw,78px);display:flex;align-items:center;gap:.3em;flex-wrap:wrap;justify-content:center;line-height:1}
.eq .box{min-width:1.4em;height:1.25em;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 4px var(--sky);display:grid;place-items:center;padding:0 .15em;color:var(--sky)}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(100%,460px)}
.keypad button{height:clamp(52px,8vh,66px);border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--line);font:700 clamp(24px,4vw,32px)/1 var(--font-display)}
.keypad button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.keypad .ok{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #24894f}
.keypad .del{background:#FFE1DB}
.nline{position:relative;width:min(100%,720px);height:110px}
.nline .bar{position:absolute;left:4%;right:4%;top:46px;height:6px;background:var(--ink);border-radius:3px}
.nline .tk{position:absolute;top:36px;width:4px;height:26px;background:var(--ink);margin-left:-2px;border-radius:2px}
.nline .tl{position:absolute;top:66px;transform:translateX(-50%);font:700 18px/1 var(--font-read)}
.nline .hit{position:absolute;top:0;height:100%;transform:translateX(-50%);border-radius:12px}
.nline .mk{position:absolute;top:2px;transform:translateX(-50%);font-size:32px}
.blocks{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.ten{width:20px;height:200px;display:grid;grid-template-rows:repeat(10,1fr);gap:2px;background:#2F6F4F;padding:2px;border-radius:4px}
.ten i,.unit{background:var(--leaf);border-radius:2px}
.unit{width:20px;height:18px;box-shadow:0 0 0 2px #2F6F4F}
.units{display:flex;flex-direction:column-reverse;gap:2px}
.arr{display:grid;gap:6px;font-size:clamp(26px,4.4vw,40px)}
.groups{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.grp{background:rgba(255,255,255,.75);border-radius:22px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:2px;max-width:150px;justify-content:center;font-size:clamp(28px,4.6vw,42px)}
.cmp{display:flex;gap:16px;align-items:center}
.ladybug{position:relative;width:180px;height:150px}

/* ---------- Tracing ---------- */
.trace-wrap{position:relative;width:min(92%,520px);aspect-ratio:1.25;background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(31,46,69,.12);overflow:hidden;touch-action:none}
.trace-wrap canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 3px 0 var(--line)}
.seg button{padding:8px 16px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- Sudoku ---------- */
.sudoku{display:grid;gap:4px;background:var(--ink);padding:6px;border-radius:16px}
.sudoku button{background:#fff;width:clamp(58px,13vw,96px);height:clamp(58px,13vw,96px);font-size:clamp(34px,7vw,58px);display:grid;place-items:center;border-radius:6px}
.sudoku button.fix{background:#EEF1F7}
.sudoku button.sel{box-shadow:inset 0 0 0 5px var(--sun)}
.sudoku .bx-r{margin-right:4px} .sudoku .bx-b{margin-bottom:4px}
.palette{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.palette button{width:72px;height:72px;border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:42px}

/* ---------- Celebration ---------- */
.celebrate{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--plum);color:#fff;text-align:center;padding:20px}
.celebrate h2{font-family:var(--font-display);font-size:clamp(34px,6vw,60px);margin:0;line-height:1}
.celebrate .stars3{display:flex;gap:10px;font-size:clamp(54px,10vw,90px)}
.celebrate .stars3 span{animation:starIn .5s ease backwards}
.celebrate .stars3 span.off{filter:grayscale(1) opacity(.35)}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.celebrate .lumi{width:120px}
.celebrate .acts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.celebrate .acts button{font-family:var(--font-display);font-size:22px;background:#fff;color:var(--ink);border-radius:999px;padding:12px 26px;box-shadow:0 5px 0 rgba(0,0,0,.2);display:inline-flex;gap:10px;align-items:center}
.celebrate .acts button svg{width:26px;height:26px}
.unlock{background:rgba(255,255,255,.18);border-radius:18px;padding:8px 16px;font-size:18px}
#confetti{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:90}

/* ---------- Parent area & modals ---------- */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(20,30,48,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:26px;padding:22px;width:min(100%,420px);box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--font-display);font-size:24px;margin:0 0 8px}
.gate-q{font-family:var(--font-display);font-size:34px;margin:6px 0 10px}
.parent{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--ground-2);overflow-y:auto}
.parent .wrap{padding-block:calc(18px + env(safe-area-inset-top,0px)) 60px;max-width:860px}
.parent h2{font-family:var(--font-display);font-size:30px;margin:0}
.parent h3{font-family:var(--font-display);font-size:21px;margin:0 0 10px}
.pcard{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 0 var(--line);margin-top:16px}
.pcard p{margin:6px 0;color:var(--ink-soft);font-size:15px;max-width:68ch}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.prow label{font-weight:700;min-width:120px}
.prow input[type=text],.prow select{border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;flex:1;max-width:100%;background:#fff;color:var(--ink)}
.prow input[type=range]{flex:1;min-width:140px}
.pbtn{background:var(--ground);border-radius:12px;padding:9px 16px;font-weight:700;min-height:44px}
.pbtn.pri{background:var(--ink);color:#fff}
.pbtn.danger{background:#FFE1DB;color:#9a2a17}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.skill:first-of-type{border-top:0}
.skill .tag{display:inline-block;font-size:12px;font-weight:700;background:var(--ground);border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--ink-soft)}
.meter{height:10px;background:var(--ground);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:6px}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.avatars{display:flex;gap:6px;flex-wrap:wrap}
.avatars button{width:44px;height:44px;border-radius:12px;font-size:26px;background:var(--ground)}
.avatars button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.who{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.who button{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--font-display);font-size:20px}
.who .av{width:110px;height:110px;border-radius:32px;background:var(--ground);display:grid;place-items:center;font-size:64px;box-shadow:0 6px 0 var(--line)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-top:10px}
.album span{aspect-ratio:1;border-radius:16px;background:var(--ground);display:grid;place-items:center;font-size:38px}
.album span.lock{filter:grayscale(1) opacity(.25)}
.pause-ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:75;background:var(--sky);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.pause-ov h2{font-family:var(--font-display);font-size:clamp(34px,6vw,56px);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:95;font-weight:700}

@media (max-width:640px){
  .worlds{grid-template-columns:1fr}
  .world{min-height:70px}
  .tile.big{grid-column:span 2}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile{min-height:150px;padding:13px}
  .stage{margin:6px;box-shadow:0 0 0 6px #fff,0 10px 26px rgba(31,46,69,.14)}
  .round-btn{width:54px;height:54px}
  .game-bottom .lumi{width:56px}
  .brand small{display:none}
  .brand{display:none}
  .chip{margin-right:auto}
  .top .wrap{gap:8px}
  .chip{padding:5px 12px 5px 5px;min-width:0}
  .chip span:nth-child(2){max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{width:44px;height:44px}
  .tile .em{font-size:44px}
  .tile.big .em{font-size:64px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Défi sans aide, défi mémoire, comparaisons (v1.1) ---------- */
.dots i.rec{background:var(--sky);box-shadow:none}
.picked{animation:pick .6s}
@keyframes pick{40%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(58,162,238,.45),0 6px 0 rgba(31,46,69,.14)}}
.defi-card{background:#fff;border-radius:28px;padding:22px 28px;text-align:center;box-shadow:0 6px 0 rgba(31,46,69,.12);max-width:min(420px,100%)}
.defi-em{font-size:clamp(52px,9vw,72px);line-height:1}
.defi-card h2{font-family:var(--font-display);font-size:clamp(28px,5vw,40px);margin:8px 0 4px}
.defi-pips{display:flex;gap:8px;justify-content:center;margin:12px 0}
.defi-pips i{width:18px;height:18px;border-radius:50%;background:var(--sky)}
.defi-card p{color:var(--ink-soft);margin:0;font-size:16px}
.memo-banner{width:100%;display:flex;align-items:center;gap:14px;background:#FFF6DB;border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 #E2BC4F;text-align:left;margin-bottom:14px;animation:glowSun 1.6s infinite;color:var(--ink)}
.memo-banner .em{font-size:42px;line-height:1;flex:none}
.memo-banner b{font-family:var(--font-display);font-size:21px}
@keyframes glowSun{50%{box-shadow:0 5px 0 #E2BC4F,0 0 0 12px rgba(255,196,61,.35)}}
.node.review{background:#C2410C;box-shadow:0 7px 0 #8a2e08}
.node .cons{position:absolute;top:-10px;right:-12px;font-size:24px;line-height:1}
.node-row .rv{color:#A8380A;font-weight:700}
.card.mini{min-width:clamp(64px,10vw,96px);min-height:clamp(64px,10vw,96px);font-size:clamp(36px,6vw,58px)}
@media (max-width:560px){.row.four{display:grid;grid-template-columns:repeat(2,auto);justify-content:center}}
.cmprows{display:flex;flex-direction:column;gap:10px;max-width:100%;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 rgba(31,46,69,.1)}
.cmprow{display:flex;align-items:center;gap:10px}
.cmprow b{min-width:58px;font-family:var(--font-display);font-size:clamp(16px,2.6vw,22px)}
.cmprow .cells{display:grid;flex:0 1 auto;min-width:0;gap:4px;justify-items:center;line-height:1.1}
.cmprow .cells .gap{display:inline-block;width:.85em;height:.85em;border:3px dashed #7D8899;border-radius:50%;box-sizing:border-box}
@media (max-width:560px){.sound-row.four{display:grid;grid-template-columns:repeat(2,auto);justify-content:center}}
.defi-note{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.35}

/* ================= v2 : personnages Luca & Lola ================= */
.av{display:block;width:100%;height:auto;overflow:visible}
.av-live{position:relative}
.av-live .av-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.av-live.happy{animation:hop .6s ease}
.av-live.oops{animation:tilt .6s ease}
.av-spark path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
/* Qui joue ? */
.who-screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:85;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(circle at 50% 30%,#FFF6D6 0,#FFE7A3 28%,var(--ground) 70%);padding:20px max(16px,env(safe-area-inset-left,0px))}
.who-in{width:min(100%,980px);display:flex;flex-direction:column;align-items:center;gap:18px}
.who-head{display:flex;align-items:center;gap:14px;text-align:left}
.who-lumi{width:84px;flex:none}
.who-head h1{font-family:var(--font-display);font-size:clamp(30px,5.4vw,52px);margin:0;line-height:1}
.who-head p{margin:4px 0 0;font-size:clamp(18px,2.6vw,26px);color:var(--ink-soft);font-family:var(--font-display)}
.who-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,34px);width:100%}
.who-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px 20px;border-radius:34px;background:#fff;box-shadow:0 8px 0 rgba(31,46,69,.14);transition:transform .15s}
.who-card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(31,46,69,.14)}
.who-luca{background:linear-gradient(#EAF4FF,#fff 55%)} .who-lola{background:linear-gradient(#FFEFF6,#fff 55%)}
.who-av{width:clamp(150px,30vw,260px);display:block;animation:float 3.2s ease-in-out infinite}
.who-lola .who-av{animation-delay:-1.6s}
.who-card b{font-family:var(--font-display);font-size:clamp(34px,5.6vw,54px);line-height:1}
.who-sub{color:var(--ink-soft);font-size:clamp(14px,1.9vw,18px)}
.who-lv{background:var(--ground);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
@media (max-width:520px){.who-head{flex-direction:column;text-align:center}.who-lumi{width:64px}}
/* Carte du personnage sur l'accueil */
.av-card{display:flex;align-items:center;gap:clamp(12px,3vw,28px);margin-top:16px;background:#fff;border-radius:28px;padding:12px 18px;box-shadow:0 5px 0 var(--line)}
.home-av{width:clamp(120px,18vw,170px);flex:none;cursor:pointer}
.av-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.av-name{font-family:var(--font-display);font-size:clamp(26px,4vw,38px);line-height:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av-lvl{font-size:15px;background:var(--sun);color:#5A3E00;border-radius:999px;padding:3px 12px;font-family:var(--font-read);font-weight:700}
.av-title{font-weight:700;color:var(--plum);font-size:17px}
.xp{height:14px;background:var(--ground);border-radius:9px;overflow:hidden;max-width:420px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#FFC43D,#FF9636);border-radius:9px}
.av-next{color:var(--ink-soft);font-size:14px}
.av-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.av-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ground);border-radius:16px;padding:10px 16px;font-weight:700;min-height:48px}
.av-btn span{font-size:24px}
.chip .av{width:38px;height:38px;border-radius:50%;background:#fff;display:block;overflow:hidden}
.chip .av svg{width:100%;height:100%}
.pav{width:44px;height:44px;border-radius:50%;background:var(--ground);overflow:hidden;flex:none}
.section-title{font-family:var(--font-display);font-size:clamp(20px,2.6vw,26px);margin:18px auto 0;display:flex;align-items:baseline;gap:10px}
.section-title small{font-family:var(--font-read);font-size:14px;color:var(--ink-soft)}
.section-title + .tiles{padding-top:10px}
/* Coffre et vestiaire */
.sheet.chest,.sheet.ward{width:min(100%,600px)}
.chest-sub{margin:0;color:var(--ink-soft)}
.album .tr{aspect-ratio:1;border-radius:16px;background:#FFF6DB;display:grid;place-items:center;font-size:38px;box-shadow:0 3px 0 #EBD58F}
.ward-av{width:min(240px,60vw);margin:0 auto}
.ward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.ward-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--ground);min-height:96px}
.ward-it .em{font-size:36px;line-height:1}
.ward-it small{font-size:12px;font-weight:700;line-height:1.15}
.ward-it.on{background:#E3F7EA;box-shadow:inset 0 0 0 3px var(--leaf)}
.ward-it.lock{opacity:.55}
@media (max-width:460px){.ward-grid{grid-template-columns:repeat(2,1fr)}}
/* Le personnage suit l'enfant dans les jeux */
.game-av{width:clamp(70px,9vw,104px);flex:none;cursor:pointer;margin-top:-26px}
.dots-track{flex:1;position:relative;display:flex;justify-content:center;padding-top:22px}
.dot-av{position:absolute;width:34px;height:34px;transform:translate(-50%,-100%);transition:left .45s cubic-bezier(.5,1.6,.5,1),top .3s;pointer-events:none}
.dot-av svg{width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.cel-av{width:clamp(120px,22vw,190px)}
.unlock.lvup{background:#FFC43D;color:#4A3300;font-weight:700}

/* ================= v2 : nouveaux jeux ================= */
/* Chemin du trésor */
.maze-wrap{display:flex;align-items:center;gap:clamp(10px,2vw,24px);flex-wrap:wrap;justify-content:center;width:100%;height:100%}
.maze{display:grid;width:min(100%,62vh,560px);background:#8CC56A;border-radius:14px;padding:4px;touch-action:none;box-shadow:0 6px 0 rgba(31,46,69,.14)}
.mz{position:relative;display:grid;place-items:center;background:#F6E7C1}
.mz.wall{background:#5FA548;background-image:radial-gradient(circle at 30% 30%,#79BE5E 0 30%,transparent 31%),radial-gradient(circle at 70% 70%,#4E9139 0 26%,transparent 27%)}
.mz.trail{background:#FFE1A3}
.mz-me{position:absolute;top:-18%;right:-18%;bottom:-18%;left:-18%;z-index:2;transition:transform .1s}
.mz-me svg{width:100%;height:100%}
.mz-star,.mz-goal{font-size:min(5vw,30px);line-height:1}
.arrows{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
.arrows button{background:#fff;border-radius:18px;box-shadow:0 5px 0 var(--line);font-size:30px}
.arrows .arr-up{grid-column:2}.arrows .arr-left{grid-column:1;grid-row:2}.arrows .arr-down{grid-column:2;grid-row:2}.arrows .arr-right{grid-column:3;grid-row:2}
/* Œil de lynx */
.lynx{display:grid;gap:clamp(8px,1.6vw,18px)}
.lynx-c{min-width:clamp(72px,12vw,120px);min-height:clamp(72px,12vw,120px);font-size:clamp(40px,7vw,70px)}
.lynx-c span{display:inline-block}
/* Première lettre */
.l1-pic{font-size:clamp(60px,11vw,110px)}
.l1-opt{font-size:clamp(48px,9vw,86px)}
.l1-box{min-width:1.2em}
.l1-box.ok{color:var(--leaf);box-shadow:inset 0 0 0 4px var(--leaf)}
.l1-rest{font-family:var(--font-read);color:var(--mute)}
.kbd{display:flex;flex-direction:column;gap:6px;align-items:center;width:min(100%,640px)}
.kb-row{display:flex;gap:6px;justify-content:center;width:100%}
.kb-k{flex:1;max-width:56px;height:clamp(42px,6vh,54px);border-radius:12px;background:#fff;box-shadow:0 4px 0 var(--line);font:700 clamp(20px,3vw,26px)/1 var(--font-read)}
/* Mots en balade */
.slot.mute-s{border-bottom-color:var(--line)}
.slots.done .word{font-size:clamp(40px,8vw,80px)}
/* Rivière des mots */
.riv-pic{font-size:clamp(50px,9vw,90px)}
.river{position:relative;display:flex;align-items:center;width:min(100%,760px);min-height:110px;background:linear-gradient(#7CC4EA,#4FA6D8);border-radius:22px;padding:10px;gap:8px;overflow:hidden}
.river::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:repeating-linear-gradient(100deg,transparent 0 30px,rgba(255,255,255,.18) 30px 34px);pointer-events:none}
.bank{width:70px;align-self:stretch;border-radius:16px;background:#B9D98A;display:grid;place-items:center;font-size:34px;flex:none;position:relative;z-index:1}
.planks{flex:1;display:flex;gap:6px;justify-content:center;position:relative;z-index:1}
.plank{min-width:clamp(62px,11vw,110px);height:58px;border-radius:12px;border:3px dashed rgba(255,255,255,.8);display:grid;place-items:center;font:700 clamp(22px,3.6vw,34px)/1 var(--font-read);color:#5A3B1E}
.plank.fill{background:#D9A86A;border:0;box-shadow:0 5px 0 #A9763C}
.riv-me{width:58px;position:relative;z-index:3;transition:transform 1s ease-in-out}
.riv-me.cross{transform:translateX(min(70vw,640px))}
.stones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stone{min-width:clamp(70px,11vw,110px);height:clamp(58px,8vw,74px);border-radius:40% 45% 38% 42%;background:#C7CDD6;box-shadow:0 6px 0 #9AA3B0;font:700 clamp(24px,4vw,36px)/1 var(--font-read);color:var(--ink);padding:0 12px}
.stone.used{visibility:hidden}
/* Robot des étoiles */
.robot-wrap{display:flex;gap:clamp(12px,2.4vw,28px);align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.rgrid{display:grid;gap:4px;width:min(100%,46vh,380px);background:#2B3A5C;padding:6px;border-radius:16px}
.rc{aspect-ratio:1;background:#3D5280;border-radius:8px;display:grid;place-items:center;font-size:clamp(20px,3.6vw,32px);position:relative}
.rc.rock{background:#33456C}
.rc.hint::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:#FFC43D;opacity:.8}
.robot{display:grid;place-items:center;position:relative;transition:transform .3s}
.robot.rel .rdir{position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px;transform:rotate(var(--r));pointer-events:none}
.robot.rel .rdir::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-8px;border:8px solid transparent;border-bottom:12px solid #FFC43D;border-top:0}
.portal{animation:spin 3s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.rpanel{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px}
.rqueue{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;background:#fff;border-radius:16px;padding:8px;width:100%;box-shadow:inset 0 0 0 3px var(--line);align-items:center;justify-content:center}
.rq-empty{color:var(--ink-soft);font-size:15px}
.rchip{width:44px;height:44px;border-radius:12px;background:var(--ground);font-size:24px}
.rchip.now{background:#FFC43D}
.rkeys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rkey{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 5px 0 var(--line);min-width:84px}
.rkey span{font-size:32px;line-height:1}.rkey small{font-size:12px;font-weight:700}
.racts{display:flex;gap:10px;align-items:center}
/* Marché */
.m-order{display:flex;align-items:center;gap:12px}
.m-who{font-size:clamp(50px,8vw,72px)}
.m-bubble{background:#fff;border-radius:22px;padding:10px 16px;display:flex;gap:14px;box-shadow:0 4px 0 var(--line);font-size:clamp(26px,4vw,36px)}
.m-need b{font-family:var(--font-display)}
.m-stall{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.m-shelf{display:flex;gap:10px;background:#E9C89A;border-radius:18px;padding:10px;box-shadow:0 5px 0 #C9A06A}
.m-prod{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:16px;padding:8px 10px;min-width:78px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.m-prod .e{font-size:clamp(36px,6vw,50px);line-height:1.1}
.m-prod .tag{font-weight:700;background:#FFF1C9;border-radius:8px;padding:1px 8px;margin-top:4px}
.m-prod[disabled]{opacity:.5}
.m-basket{min-width:200px;max-width:360px;min-height:80px;border-radius:14px 14px 40px 40px;background:#C98A4B;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 8px,transparent 8px 18px);display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;padding:8px 14px 16px}
.m-in{font-size:32px;line-height:1}
.m-empty{color:#fff;font-weight:700;font-size:14px}
.m-paybox{display:flex;flex-direction:column;align-items:center;gap:10px}
.m-sum{font-family:var(--font-display);font-size:22px}
.m-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;min-width:240px;max-width:520px;justify-content:center;align-items:center;background:#fff;border-radius:16px;padding:6px 10px;box-shadow:inset 0 0 0 3px var(--line)}
.m-tray .m-empty{color:var(--ink-soft)}
.m-bank{display:flex;gap:12px}
.coin{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;font:700 17px/1 var(--font-read);color:#3B2E00;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.coin.c1{background:radial-gradient(circle,#D9DDE3 0 52%,#E8C35A 54%)}
.coin.c2{background:radial-gradient(circle,#E8C35A 0 52%,#D9DDE3 54%)}
.bill{display:inline-grid;place-items:center;width:78px;height:46px;border-radius:8px;font:700 17px/1 var(--font-read);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bill.b5{background:#8E9AA6}.bill.b10{background:#D9534F}
/* Jardins en miroir */
.mirror{display:flex;align-items:center;gap:clamp(8px,2vw,22px)}
.mside{display:flex;flex-direction:column;align-items:center;gap:4px}
.mside small{font-weight:700;color:var(--ink-soft)}
.mgrid{display:grid;gap:4px;background:#CFE3B5;padding:6px;border-radius:14px}
.mgrid.mine{background:#E6F2D6;box-shadow:inset 0 0 0 3px #A7C77F}
.mc{width:clamp(44px,8.5vw,72px);aspect-ratio:1;background:#fff;border-radius:8px;display:grid;place-items:center}
.mc svg{width:86%;height:86%}
.mc.bad{box-shadow:inset 0 0 0 4px var(--no)}
.ghost-p{opacity:.35;width:100%;height:100%;display:grid;place-items:center}
.maxis{font-size:28px;align-self:stretch;display:flex;align-items:center;border-left:4px dashed #9BB57A;padding-left:6px}
.mpal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mtool{width:62px;height:62px;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.mtool svg{width:80%;height:80%}
.mtool.sel{box-shadow:0 0 0 5px var(--sky),0 4px 0 var(--line)}

/* ================= v2 : tablette (Lola) et souris (Luca) ================= */
body[data-world="petits"] .tiles{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
body[data-world="petits"] .tile{min-height:190px}
body[data-world="petits"] .tile b{font-size:clamp(21px,2.8vw,27px)}
@media (hover:hover) and (pointer:fine){
  .card:hover,.tile:hover,.who-card:hover,.stone:hover,.ltile:hover,.m-prod:hover,.mtool:hover,.rkey:hover,.kb-k:hover,.isle:hover,.node:hover{transform:translateY(-3px)}
  .card,.stone,.ltile,.m-prod,.mtool,.rkey,.kb-k{transition:transform .12s}
}
.picked{animation:pick .6s}

.tile.sm{justify-content:space-between}
.tile.sm .tl-top{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%}
.tile.sm .tl-top b{max-width:100%;font-size:clamp(19px,2.2vw,23px);hyphens:auto}
.tile.sm .sub{max-width:100%}
.tile.sm .tl-bot{display:flex;flex-direction:column;gap:8px;width:100%}
.tile.sm .tl-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.tile.sm .em2{font-size:clamp(40px,5vw,54px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));transition:transform .3s}
.tile.sm:hover .em2{transform:rotate(-8deg) scale(1.06)}

.av.av-head{overflow:hidden}
.tile .lv{white-space:nowrap}.tile.sm .em2{font-size:clamp(34px,4.2vw,48px)}

.who-row.one{grid-template-columns:minmax(0,420px);justify-content:center}
.who-other{color:var(--ink-soft);text-decoration:underline;font-size:16px;padding:8px}

.defi-pips.keys i{width:auto;height:auto;background:none;font-size:24px;font-style:normal;filter:grayscale(1);opacity:.35;transition:.3s}
.defi-pips.keys i.on{filter:none;opacity:1}
.defi-flash{animation:popin .35s ease-out}
.defi-chest{font-size:clamp(70px,14vw,110px);line-height:1.1;animation:wiggle .5s ease-in-out infinite}
.defi-chest.open,.defi-chest.shut{animation:popin .4s ease-out}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

.gp-card{display:flex;flex-direction:column;align-items:center;gap:8px}
.gp-n{font-family:var(--font-display);font-size:clamp(54px,10vw,92px);line-height:1}
.gp-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gp-dots i{width:14px;height:14px;border-radius:50%;border:2px solid #9BB3CC;box-sizing:border-box}
.gp-dots i.on{background:#FF6B57;border-color:#FF6B57}
.gp-ico{font-size:clamp(40px,7vw,60px);line-height:1;margin-bottom:6px}

/* Alphabet mobile (Montessori / Alvarez) : voyelles en bleu, consonnes en rouge */
.ltile.voy{color:#1F6FCC}
.ltile.con{color:#D93A3A}

/* ================= Maison de Lumi ================= */
.cw{font-family:var(--font-read);font-weight:700;letter-spacing:.02em}
.cw .voy{color:#1F6FCC}.cw .con{color:#D93A3A}.cw .sp{display:inline-block;width:.3em}
.cw.big{font-size:clamp(32px,6vw,52px)}
.ov-screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--ground-2);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--ground-2)}
.ov-top h2{font-family:var(--font-display);font-size:clamp(24px,4.4vw,36px);margin:0}
.ov-body{padding:4px 16px 40px;max-width:1100px;margin:0 auto}
/* parcours du jour */
.daily{background:#fff;border-radius:24px;padding:14px 16px;margin-top:14px;box-shadow:0 6px 0 rgba(31,46,69,.08)}
.daily-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.daily-head b{font-family:var(--font-display);font-size:clamp(20px,3.4vw,26px)}
.daily-head span{color:var(--ink-soft);font-size:14px}
.daily-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.daily-step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:#F3F6FC;border:3px solid transparent;text-align:left;min-width:0}
.daily-step.next{border-color:#FFC43D;background:#FFF8E1}
.daily-step.ok{background:#E6F6EA;opacity:.85}
.ds-n{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.daily-step.ok .ds-n{background:#35B872;color:#fff}
.ds-em{font-size:28px;flex:none}
.ds-t{font-weight:700;font-size:15px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* maison */
.house{margin-top:18px;position:relative}
.house-roof{height:clamp(46px,8vw,70px);margin:0 6px -2px}
.house-roof svg{width:100%;height:100%;display:block}
.house-deco{position:absolute;top:-6px;left:0;right:0;display:flex;justify-content:space-around;font-size:clamp(22px,4vw,34px);pointer-events:none;z-index:1}
.house-deco span:nth-child(odd){transform:translateY(10px) rotate(-8deg)}
.house-body{background:#F7E7CF;border:6px solid #C99A6B;border-radius:0 0 24px 24px;padding:12px}
.house-rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.room{position:relative;background:#fff;border-radius:16px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--rc) 22%,#fff);transition:transform .12s}
.room .r-em{font-size:clamp(34px,6vw,50px);line-height:1}
.room b{font-size:clamp(13px,2vw,16px);line-height:1.15;text-align:center}
.room.on{border-color:var(--rc);transform:translateY(-3px)}
.room.garden{background:linear-gradient(#DFF3C9,#BFE39A)}
.r-badge{position:absolute;top:-8px;right:-6px;background:#FF6B57;color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:12px}
.room-content{margin-top:12px}
.room-content .section-title{margin:6px 0 10px}
/* jardin */
.g-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.g-drops{display:flex;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:8px 14px;font-size:24px;box-shadow:0 4px 0 var(--line)}
.g-help{flex:1;color:var(--ink-soft);min-width:180px}
.g-field{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:linear-gradient(#B7E08F,#8CC665);padding:16px;border-radius:26px}
.plot{position:relative;aspect-ratio:1.15;min-height:120px;border-radius:20px;background:#8B5E3C;box-shadow:inset 0 -10px 0 #6E4729;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff}
.plot.empty{background:#A87A52;opacity:.85}
.plot.wet{background:#6B4428}
.pl-em{font-size:clamp(46px,9vw,80px);line-height:1}
.plot.empty .pl-em{font-size:40px}
.pl-t{font-weight:800;font-size:15px}
.pl-grow{display:flex;gap:5px}.pl-grow i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)}.pl-grow i.on{background:#7BE07B}
.pl-pest{position:absolute;font-size:34px;animation:wiggle 1s ease-in-out infinite}
.pl-pest.weed{left:8px;bottom:10px}.pl-pest.snail{right:8px;top:8px}
.grown-3{background:#5E8B3A;box-shadow:inset 0 -10px 0 #4A7030}
.grown-3 .pl-em{animation:popin .5s ease-out}
.sheet.seeds{width:min(100%,560px)}
.seed-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.seed{padding:16px 8px;border-radius:16px;background:#FFF4DC;box-shadow:0 5px 0 #E8CF96}
.seed-pack{font-size:clamp(18px,3vw,26px);overflow-wrap:anywhere}.seed-pack.em{font-size:52px}
/* cuisine */
.k-pantry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:10px 14px;margin-bottom:14px}
.k-have{font-size:22px;background:#FFF4E6;border-radius:12px;padding:2px 8px}
.k-none{color:var(--ink-soft)}
.k-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
